schema: spec-driven

context: |
  Proyecto: Apuntes Proyecto Intermodular (DAW). Sitio web educativo project-facing.
  Stack: Astro 7 + Starlight 0.41 + MDX, solo castellano, GitHub Pages, base path
    /ApuntesProyectoDAW, rama main. Guía Didáctica (pi1/, pi2/, metodologia...) NO se toca.
  Contenido: sección "Apuntes" con 17 unidades didácticas (8 de PI1 en
    src/content/docs/apuntes-pi1/, 9 de PI2 en src/content/docs/apuntes-pi2/).
    Cada unidad se amplía como "libro": índice uX-<slug>.mdx + subcarpeta
    uX-<slug>/ con 9 puntos MDX (01-…08 teoría + 09-cierre.mdx).
    Componentes propios MDX: StoryIntro (apertura narrativa), Comparativa (dilemas,
    dialogos: [{quien, texto}]), CasoPractico (ejemplos, solo prop titulo),
    Aclaracion (dudas colapsables, prop pregunta).
  Cierre de unidad (punto 09) con secciones del repo: ⭐ Sé el Proyecto,
    🔥 Dilema de equipo (Comparativa), 🕵️ ¿Quién Soy?, ⚡ Laboratorio de Tortura
    (SIEMPRE con fallo intencionado, soluciones en <details>), 🧠 Atrévete a Pensar,
    💬 Entrevista de trabajo, 🤷 Preguntas Tontas, 🎬 Post-Créditos con
    "PRÓXIMAMENTE EN UXX" (la última unidad cierra con 🏁 Fin del viaje y SIN próximamente).
    Sin boletines, sin Head First, sin CONRAD. Sin imágenes nuevas (solo texto,
    tablas, bloques y diagramas ASCII).
  Norma de contenido: nivel de entrada cero, analogías cotidianas, cada punto de
    teoría ~110-260 líneas, cierre ~220-260 líneas, continuidad narrativa encadenada
    entre unidades. CEs = competencias CG/CE de pi1/competencias.mdx y
    pi2/competencias.mdx. Sidebar y build los gestiona el orquestador; cada subagente
    solo escribe MDX + openspec/changes/expand-uNN/ y autoverifica YAML con node/js-yaml
    (regex /^---\r?\n/, errores solo-CRLF ignorados, valores con ": " entrecomillados).
